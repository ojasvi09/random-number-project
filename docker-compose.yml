
services:

  postgres:
    image: postgres:16-alpine
    container_name: random-number-postgres
    environment:
      POSTGRES_DB: randomdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d randomdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: random-number-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  microservice-b:
    build:
      context: .
      dockerfile: microservice-b/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/randomdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  microservice-a:
    build:
      context: .
      dockerfile: microservice-a/Dockerfile
    ports:
      - "8081:8081"
    environment:
      MICROSERVICE_B_URL: http://microservice-b:8082
    depends_on:
      - microservice-b

volumes:
  postgres-data:
  redis-data: