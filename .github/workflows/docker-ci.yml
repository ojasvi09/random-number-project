
name: Build and Push Docker Images to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and Push Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Microservice A
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./microservice-a/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/microservice-a:latest

      - name: Build and Push Microservice B
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./microservice-b/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/microservice-b:latest
